# Fast-iteration test config used during development. Renders 3s of output
# from `footage/sample.MP4` (the synthetic 5s clip generated by ffmpeg).

schema_version = 1

[project]
name            = "Smoke Test"
target_duration = "3s"
fps             = 30
seed            = 1

[[outputs]]
path          = "out/smoke.mp4"
resolution    = "1280x720"
encoder       = "auto"
crf           = 22

[input]
folder  = "footage/"
include = ["**/*.MP4", "**/*.mp4"]

[selection]
min_clip = "500ms"
max_clip = "1s"
