# People-centric vacation footage — exactly where ML signals shine.
# 80 files / ~101 GB. With ~30 picks and 80 sources, the per-source cap = 1,
# so every clip we pick is from a different source for maximum variety.

schema_version = 1

[project]
name            = "Egipt · 5-min highlights"
target_duration = "5m"
fps             = 30
seed            = 23
fade_in         = "800ms"
fade_out        = "1200ms"
# temp_dir      = "out/.vibecut_egypt"   # default: <primary_output_dir>/.vibecut_<name>

[[outputs]]
path          = "out/egypt_5min.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

# Add a 4K sibling render if you have a 4K source set:
# [[outputs]]
# path       = "out/egypt_5min_4k.mp4"
# resolution = "3840x2160"
# encoder    = "auto"
# crf        = 22

[input]
folder  = "E:/DATA/GOPRO VIDEO/2025.08 - Vacanță în Egipt"
include = ["**/*.MP4"]

[soundtrack]
# Single track (shorthand). Use `files = ["a.mp3", "b.mp3"]` for multi-track concat.
file              = "footage/beach moments.mp3"
beat_align        = true
duck_count        = 6
duck_min_spacing  = "30s"
duck_min_dur      = "5s"
duck_max_dur      = "10s"
ducking_db        = -18
fade_out          = "2000ms"
# People-centric vacation footage benefits from a higher speech weight so
# Silero VAD-driven duck windows lock onto talking moments more aggressively.
vad_speech_weight = 2.0

[selection]
min_clip       = "2s"
max_clip       = "5s"
max_per_source = 5

[transition]
default  = "fade"
duration = "500ms"

[intro]
duration = "3.0s"
mode     = "card"
bg_color = "#0a1628"
fade_in  = "600ms"
fade_out = "600ms"

[[intro.layers]]
kind     = "text"
content  = "Egipt · 2025"
font     = "arialbd.ttf"
size     = 120
color    = "#FFE4B5"
position = "center"

[outro]
duration = "3.0s"
mode     = "overlay"
fade_in  = "400ms"
fade_out = "800ms"

[[outro.layers]]
kind       = "text"
content    = "@vbocan · vacanță 2025"
font       = "arialbd.ttf"
size       = 64
color      = "#FFFFFF"
position   = "bottom-center"
background = { color = "#000000AA", padding = "20px" }

[grading]
# HyperSmooth in-camera already stabilizes modern GoPro footage. Only turn
# this on for HyperSmooth-Off recordings or other shaky non-GoPro sources.
stabilize = false
