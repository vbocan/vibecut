# Vibecut example configuration. Every key shown here is optional
# unless commented otherwise.

schema_version = 1

[project]
name = "Summer Surf"
target_duration = "60s"
fps = 30
seed = 42
# temp_dir = "out/.vibecut_summer_surf"  # default: <output dir>/.vibecut_<name>

[[outputs]]
path          = "out/summer_surf.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"
# preset      = "p5"          # NVENC preset; or "veryfast" for libx264

# Add a 4K render alongside 1080p:
# [[outputs]]
# path       = "out/summer_surf_4k.mp4"
# resolution = "3840x2160"
# encoder    = "auto"
# crf        = 22

[input]
folder = "footage/"
include = ["**/*.MP4", "**/*.mp4"]
# Optional manual cut ranges that override automatic selection:
# [[input.ranges]]
# file = "GX010023.MP4"
# start = "1m12s"
# end   = "1m30s"

[soundtrack]
file = "music/track.wav"
beat_align = true
energy_drives_pacing = true
ducking_db = -18.0

[scoring]
hilight_tags          = 1.0
accel_peaks           = 0.6
gps_speed             = 0.4
faces                 = 0.3
motion_peaks          = 0.3   # visual frame-difference MSD
sharpness_floor       = 0.2   # reject bottom 20% by Laplacian variance
exposure_floor        = 0.15
diversity_per_source  = 0.5

[selection]
min_clip = "1.5s"
max_clip = "6s"
order    = "energy_arc"   # or "chronological"

[transition]
default  = "fade"
duration = "400ms"
palette  = ["fade", "dissolve", "circleopen"]

[intro]
duration = "2.5s"
fade_in  = "400ms"
fade_out = "400ms"
mode     = "card"
bg_color = "#000000"

[[intro.layers]]
kind     = "text"
content  = "Costa Rica · 2026"
font     = "Inter-Bold.ttf"
size     = 96
color    = "#FFFFFF"
position = "center"

# [[intro.layers]]
# kind     = "image"
# path     = "logos/brand.png"
# position = "top-right"
# height   = 120
# x_offset = -40
# y_offset = 40
# opacity  = 0.9

[outro]
duration = "2s"
mode     = "card"

[[outro.layers]]
kind     = "text"
content  = "@vbocan"
position = "bottom-right"

[multi_angle]
enabled  = false
sync     = "auto"
min_hold = "1s"

[grading]
# lut       = "luts/teal_orange.cube"
stabilize = false
