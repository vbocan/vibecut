# DJI drone footage of Biserica din Chișoda, May 2026.
# 90-second contemplative drone edit — modeled on examples/tomesti_2026.toml.

schema_version = 1

[project]
name            = "Biserica din Chișoda · 2026"
target_duration = "1m30s"
fps             = 30
seed            = 17
fade_in         = "500ms"
fade_out        = "5000ms"   # long footage fade-to-black at the end

[[outputs]]
path          = "out/chisoda_2026.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
# _staging holds hardlinks of the 5 unchanged MP4s + a 15s stream-copy
# trim of DJI_0691.MP4. Hard constraint, not a soft score-zero.
folder  = "E:/DATA/DRONE FOOTAGE/2026.05 - Biserica din Chișoda/_staging"
include = ["**/*.MP4"]

[soundtrack]
file       = "footage/beach moments.mp3"
beat_align = true
duck_count = 0       # DJI = no source audio
fade_out   = "5000ms"
beat_burst = "off"   # contemplative — no rapid cuts

[selection]
min_clip       = "3s"
max_clip       = "7s"
max_per_source = 6
order          = "energy_arc"
variety        = 0.15

[transition]
default                = "fade"
duration               = "600ms"
speed_ramp_probability = 0.0   # OFF — calm drone pacing

[intro]
duration = "4.5s"
mode     = "card"
bg_color = "#000000"
fade_in  = "700ms"
fade_out = "600ms"

[[intro.layers]]
kind         = "text"
content      = "Duminică în Chișoda"
font         = "arialbd.ttf"
size         = 96
color        = "#FFFFFF"
position     = "center"
appear_at    = "0s"
disappear_at = "2.3s"

[[intro.layers]]
kind         = "text"
content      = "10 mai 2026"
font         = "arial.ttf"
size         = 48
color        = "#E8D8B5"
position     = "center"
appear_at    = "2.5s"
disappear_at = "4.5s"

[grading]
stabilize = false   # DJI gimbal handles this
