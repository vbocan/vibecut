# DJI drone footage from Tomești, Easter 2026. Acoustic, contemplative
# soundtrack — beat-burst will likely auto-skip on a slow acoustic track,
# which is the right call for this kind of footage.
#
# DJI drones don't record audio in flight, so the duck-window selector
# correctly excludes every segment from being a duck candidate (no-audio
# guard added to select_duck_windows). Soundtrack plays continuously.

schema_version = 1

[project]
name            = "Tomești · Învierea Domnului 2026"
target_duration = "2m"
fps             = 30
seed            = 42
fade_in         = "500ms"   # whole-output fade-from-black at start
# Long, gradual fade-to-black of the actual footage at the very end.
# This drives the fade visually — there's no separate outro card.
fade_out        = "6000ms"

[[outputs]]
path          = "out/tomesti_2026.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
folder  = "E:/TEMP/Tomesti2026"
include = ["**/*.MP4"]   # MP3 is auto-excluded by the include pattern

[soundtrack]
file              = "E:/TEMP/Tomesti2026/ikoliks_aj-acoustic-spring-mothers-day-music-320427.mp3"
beat_align        = true
duck_count        = 0       # DJI = no source audio, ducking has nothing to reveal
fade_out          = "6000ms"  # match the 6 s video fade so audio eases out at the same pace
beat_burst        = "off"   # contemplative footage — never break into rapid cuts

[selection]
min_clip       = "3s"
max_clip       = "8s"
max_per_source = 8          # only 4 source files; allow each to contribute several picks
order   = "energy_arc"      # weakest at the edges, climax in the middle
variety = 0.20              # vary which moments occupy peak vs edges across renders

[transition]
default                = "fade"
duration               = "600ms"
# Speed-ramp DELIBERATELY OFF — the whip-up is a high-energy reel effect
# that fights the calm, deliberate pacing of contemplative drone footage.
# Leave it for content where the kinetic feel reinforces the subject
# (see examples/masinuta.toml).
speed_ramp_probability = 0.0

# --- Intro: solid black, two-stage text ---
[intro]
duration = "5.0s"
mode     = "card"
bg_color = "#000000"
fade_in  = "700ms"
fade_out = "700ms"

[[intro.layers]]
kind         = "text"
content      = "Tomești"
font         = "arialbd.ttf"
size         = 132
color        = "#FFFFFF"
position     = "center"
appear_at    = "0s"
disappear_at = "2.4s"

[[intro.layers]]
kind         = "text"
content      = "Învierea Domnului, 12.04.2026"
font         = "arial.ttf"
size         = 56
color        = "#E8D8B5"   # soft warm cream, fitting the season
position     = "center"
appear_at    = "2.6s"
disappear_at = "5.0s"

# No outro card — `[project].fade_out = "6000ms"` above gradually fades the
# last 6 s of footage to black, which is what you actually want for a
# contemplative ending (a separate solid-black card just appears as a hard
# cut from footage to black via the transition xfade).

[grading]
# DJI drones use gimbal stabilisation; vidstab adds nothing.
stabilize = false
