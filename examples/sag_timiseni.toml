# Showcases the intro/outro features inspired by GoPro Quik:
#
#   - Two-stage staged-text intro (each line has its own visibility window)
#       1. "Mănăstirea Șag-Timișeni" visible 0 → 2.5 s, fades in/out
#       2. "8 martie 2020" visible 2.8 → 5 s
#   - Logo overlay on outro footage
#       The GoPro logo rides on the last segment's actual footage; no separate
#       outro card. Image layer fades in at 1 s into the outro window and stays
#       through to the end.
#
# Note on "growing text": ffmpeg 8.x's drawtext crashes on time-varying
# `fontsize` expressions, so `size_end` (if set) is treated as a constant
# target size. For a stepped grow effect, split a layer into two with
# overlapping `appear_at`/`disappear_at` windows + crossfade — see the
# commented examples in `[intro]` below.
#
# Run:
#   vibecut run examples/sag_timiseni.toml

schema_version = 1

[project]
name            = "Mănăstirea Șag-Timișeni"
target_duration = "90s"
fps             = 30
seed            = 42
fade_in         = "500ms"
fade_out        = "1000ms"

[[outputs]]
path          = "out/sag_timiseni.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
folder  = "E:/DATA/GOPRO VIDEO/2020.03 - Măn. Șag"
include = ["**/*.MP4"]

[soundtrack]
file              = "footage/alexzavesa-dance-playful-night-510786.mp3"
beat_align        = true
duck_count        = 2
duck_min_spacing  = "20s"
duck_min_dur      = "4s"
duck_max_dur      = "6s"
ducking_db        = -18
fade_out          = "3000ms"
beat_burst        = "auto"

[selection]
min_clip = "2s"
max_clip = "5s"

[transition]
default  = "fade"
duration = "400ms"

# --- Two-stage growing-text intro (card mode, solid black background) ---
[intro]
duration = "5.5s"
mode     = "card"
bg_color = "#000000"
fade_in  = "500ms"   # default per-layer fade-in (layers can override)
fade_out = "500ms"

# Stage 1: title — appears immediately, fades out around 2.5 s.
[[intro.layers]]
kind          = "text"
content       = "Mănăstirea Șag-Timișeni"
font          = "arialbd.ttf"
size          = 96
color         = "#FFFFFF"
position      = "center"
appear_at     = "0s"
disappear_at  = "2.5s"

# Stage 2: date — appears just after stage 1 ends.
[[intro.layers]]
kind          = "text"
content       = "8 martie 2020"
font          = "arial.ttf"
size          = 72
color         = "#FFE4B5"
position      = "center"
appear_at     = "2.8s"
disappear_at  = "5.0s"

# Stepped-grow workaround example (commented out; copy + uncomment if wanted):
# Two layers with the same content, different sizes, overlapping windows.
# A 300 ms crossfade between them produces a discrete two-step grow effect.
#
# [[intro.layers]]
# kind         = "text"
# content      = "Mănăstirea Șag-Timișeni"
# size         = 80
# appear_at    = "0s"
# disappear_at = "1.4s"
# fade_out     = "300ms"
#
# [[intro.layers]]
# kind         = "text"
# content      = "Mănăstirea Șag-Timișeni"
# size         = 110
# appear_at    = "1.1s"      # overlaps the previous layer's last 300 ms
# disappear_at = "2.5s"
# fade_in      = "300ms"

# --- Logo on outro footage (overlay mode) ---
# The last segment's footage plays normally; the GoPro logo composites on top.
# Logo fades in 1 s into the outro window, holds, fades out with the segment.
[outro]
duration = "5s"
mode     = "overlay"      # rides on real footage, no separate card
fade_in  = "500ms"
fade_out = "1000ms"

[[outro.layers]]
kind          = "image"
path          = "footage/GoPro-logo.jpeg"
position      = "center"
height        = 220
opacity       = 0.92
appear_at     = "1s"      # 1 s into the 5 s outro window
disappear_at  = "5s"
fade_in       = "600ms"
fade_out      = "800ms"

[grading]
# HyperSmooth in-camera already stabilizes modern GoPro footage.
stabilize = false
