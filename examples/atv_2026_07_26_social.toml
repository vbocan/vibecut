# DJI Neo selfie-drone follow-shot: ATV ride through the hay fields at
# Tomești with the kids riding in the trailer, 26 July 2026. Single
# continuous 5m07s take, no audio (DJI = no source audio). Usable range is
# the user's picks 0:32-4:58, enforced by padding [[selection.exclude]] on
# both ends.
#
# SOCIAL MEDIA CUT: ~1 minute, no intro/outro text cards — just the plain
# project fade_in/fade_out. See atv_2026_07_26_personal.toml for the longer
# (2min+) version with title card + signed-off outro, aimed at personal/
# family archival use rather than sharing.
#
# Three moments are hard-pinned via [[input.ranges]] so the picker can't miss
# them: the close pass by the round hay bale at 2:33 (kids reach out and
# touch it) and two "ATV filmed from the side" angles near the houses
# (~3:22 and ~3:33). Matching [[selection.exclude]] windows around each keep
# the auto-picker from re-discovering near-duplicates of the same moments.
#
# order = chronological (not energy_arc, unlike examples/chisoda_drona_2026.toml)
# — this is one uninterrupted take with a real beginning-to-end arc (field ->
# hay bale -> lane -> yard), so recording order reads better than a reshuffle.

schema_version = 1

[project]
name            = "La plimbare cu ATV-ul · social · 26 iulie 2026"
target_duration = "45s"   # + ~16s of forced ranges below -> final output ~1 min
fps             = 30
seed            = 726
fade_in         = "400ms"
fade_out        = "1000ms"   # a touch longer than the personal cut's — it's the only "the end" cue we have with no outro card

[[outputs]]
path          = "out/atv_2026_07_26_social.mp4"
resolution    = "1920x1080"
encoder       = "auto"
# crf 20 gave ~245MB for 61s — too heavy for WhatsApp. 26 + a slower preset
# (better compression efficiency per bit, cheap here since it's a one-off
# 61s encode) targets a much smaller file; check actual size after render
# and adjust crf further if still too big.
crf           = 26
preset        = "slow"
audio_bitrate = "128k"

[input]
folder = "in"
# default include (**/*.MP4, **/*.mp4) already matches the one DJI file here

[[input.ranges]]   # kids touch the round hay bale as the ATV passes close by
file  = "DJI_20260726134120_0047_D.MP4"
start = "2m29s"
end   = "2m35s"

[[input.ranges]]   # ATV + trailer filmed side-on along the fenced lane
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m22s"
end   = "3m28s"

[[input.ranges]]   # second lateral angle, turning in toward the gate
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m33s"
end   = "3m37s"

[soundtrack]
file       = "footage/ikoliks_aj-marketing-instagram-reels-music-291947.mp3"
beat_align = true
duck_count = 0        # DJI = no source audio, nothing to duck/reveal
fade_out   = "2000ms"
# "auto" was tried first (with a different track): it triggered a rapid-cut
# burst that landed right on top of — and silently replaced, via the
# post-order segment splice — the forced lateral-angle pick at 3:33-3:37.
# Off avoids re-risking that collision with the [[input.ranges]] picks.
beat_burst = "off"

[selection]
min_clip = "1.8s"
max_clip = "4.5s"
order    = "chronological"
variety  = 0.15

[[selection.exclude]]   # before the user's 0:32 start point
file  = "DJI_20260726134120_0047_D.MP4"
start = "0s"
end   = "34s"

[[selection.exclude]]   # padding around the forced hay-bale pick (2:29-2:35)
file  = "DJI_20260726134120_0047_D.MP4"
start = "2m25s"
end   = "2m39s"

[[selection.exclude]]   # padding around the two forced lateral picks (3:22-3:37),
# extended to 3:58 to also cover the rider reaching up and grabbing the
# drone out of the air right after — the auto-picker liked its motion/
# sharpness signal but it's just a close-up blur of a cap, not usable.
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m18s"
end   = "3m58s"

[[selection.exclude]]   # after the user's 4:58 end point
file  = "DJI_20260726134120_0047_D.MP4"
start = "296s"
end   = "310s"

[transition]
default                = "fade"
duration               = "350ms"
speed_ramp_probability = 0.35
speed_ramp_duration    = "1500ms"
speed_ramp_factor      = 3.0
speed_ramp_flash       = true

# No [intro] / [outro] — social cut is footage-only, framed by fade_in/fade_out.

[grading]
stabilize = false   # DJI gimbal already handles this
