# Family event highlight reel from 6 short GoPro clips. Each MP4 is its own
# source (no GoPro chapter chain), so the picker has 6 distinct moments to
# draw from. ~90s output with intro card, outro overlay, beat-burst at the
# soundtrack's energy peak, and Silero VAD-driven ducking that prefers
# segments where someone's actually talking.

schema_version = 1

[project]
name            = "Ziua Mariei · 2025"
target_duration = "90s"
fps             = 30
seed            = 42
fade_in         = "600ms"
fade_out        = "1000ms"

[[outputs]]
path          = "out/ziua_mariei.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
folder  = "E:/DATA/GOPRO VIDEO/2025.05 - Ziua Mariei"
include = ["**/*.MP4"]

[soundtrack]
# Same soundtrack as examples/egypt.toml. Smart-loop + 2 s qsin crossfade
# handles tracks shorter than the output duration.
file              = "footage/beach moments.mp3"
beat_align        = true
duck_count        = 2
duck_min_spacing  = "20s"
duck_min_dur      = "4s"
duck_max_dur      = "6s"
ducking_db        = -18
fade_out          = "2500ms"
beat_burst        = "auto"

[selection]
min_clip = "2s"
max_clip = "5s"

[transition]
default  = "fade"
duration = "400ms"

[intro]
duration = "4.0s"
mode     = "card"
bg_color = "#1a2b3c"
fade_in  = "600ms"
fade_out = "500ms"

[[intro.layers]]
kind     = "text"
content  = "Ziua Mariei · 2025"
font     = "arialbd.ttf"
size     = 96
color    = "#FFE4B5"
position = "center"

[outro]
duration = "5.0s"
mode     = "overlay"
fade_in  = "600ms"
fade_out = "1000ms"

[[outro.layers]]
kind       = "text"
content    = "@vbocan · mai 2025"
font       = "arialbd.ttf"
size       = 64
color      = "#FFFFFF"
position   = "bottom-center"
background = { color = "#000000AA", padding = "20px" }

[grading]
# HyperSmooth in-camera already stabilizes modern GoPro footage. Only turn
# this on for HyperSmooth-Off recordings or other shaky non-GoPro sources.
stabilize = false
