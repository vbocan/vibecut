# DJI Neo selfie-drone follow-shot: ATV ride through the hay fields at
# Tomești with the kids riding in the trailer, 26 July 2026. Single
# continuous 5m07s take, no audio (DJI = no source audio). Usable range is
# the user's picks 0:32-4:58, enforced by padding [[selection.exclude]] on
# both ends.
#
# PERSONAL / ARCHIVAL CUT: 2min+, title card intro + signed-off outro.
# See atv_2026_07_26_social.toml for the ~1min cut meant for sharing (no
# text cards, just fade_in/fade_out).
#
# target_duration = 2m is deliberately higher than the 2m+ we actually want:
# the K-solver formula subtracts intro/outro duration from the body budget,
# and [[input.ranges]] forced picks are added on TOP of that budget rather
# than counted against it (see run_pipeline.rs), so the real final length
# lands a bit past the configured target once you add the ~16s of forced
# ranges below. Verified empirically via --explain; adjust if source
# footage or forced ranges change.
#
# Three moments are hard-pinned via [[input.ranges]] so the picker can't miss
# them: the close pass by the round hay bale at 2:33 (kids reach out and
# touch it) and two "ATV filmed from the side" angles near the houses
# (~3:22 and ~3:33). Matching [[selection.exclude]] windows around each keep
# the auto-picker from re-discovering near-duplicates of the same moments.
#
# order = chronological (not energy_arc, unlike examples/chisoda_drona_2026.toml)
# — this is one uninterrupted take with a real beginning-to-end arc (field ->
# hay bale -> lane -> yard), so recording order reads better than a reshuffle.

schema_version = 1

[project]
name            = "La plimbare cu ATV-ul · personal · 26 iulie 2026"
target_duration = "2m"   # + ~16s of forced ranges + intro -> final output ~2m10s+
fps             = 30
seed            = 726
fade_in         = "400ms"
fade_out        = "800ms"

[[outputs]]
path          = "out/atv_2026_07_26_personal.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
folder = "in"
# default include (**/*.MP4, **/*.mp4) already matches the one DJI file here

[[input.ranges]]   # kids touch the round hay bale as the ATV passes close by
file  = "DJI_20260726134120_0047_D.MP4"
start = "2m29s"
end   = "2m35s"

[[input.ranges]]   # ATV + trailer filmed side-on along the fenced lane
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m22s"
end   = "3m28s"

[[input.ranges]]   # second lateral angle, turning in toward the gate
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m33s"
end   = "3m37s"

[soundtrack]
file       = "footage/ikoliks_aj-marketing-instagram-reels-music-291947.mp3"
beat_align = true
duck_count = 0        # DJI = no source audio, nothing to duck/reveal
fade_out   = "2000ms"
# "auto" was tried first (with a different track): it triggered a rapid-cut
# burst that landed right on top of — and silently replaced, via the
# post-order segment splice — the forced lateral-angle pick at 3:33-3:37.
# Off avoids re-risking that collision with the [[input.ranges]] picks.
beat_burst = "off"

[scoring]
# Defaults (0.2 / 0.15) hard-zero the bottom 20%/15% of frames by Laplacian
# sharpness / exposure, *relative to this one source* — fine for a folder of
# varied GoPro chapters, but this is one uniform gimbal-stabilized DJI take,
# so "bottom 20% by relative sharpness" is still perfectly watchable footage,
# not blur to reject. At 2 minutes the picker needs ~28 well-spaced picks,
# and zeroing that much of the curve left too few positive candidates —
# the picker fell back to filler picks *inside* the excluded pre-0:32 zone
# (visible in --explain as score=0.000 picks at vt<32s). Flooring off fixes
# it at the source instead of further shrinking the target duration.
hilight_tags         = 1.0
accel_peaks          = 0.6
gps_speed            = 0.4
faces                = 0.3
motion_peaks         = 0.3
sharpness_floor      = 0.0
exposure_floor       = 0.0
diversity_per_source = 0.5

[selection]
# Longer holds than the social cut's 1.8-4.5s: this is a calmer, longer
# personal cut, and needs fewer distinct picks to fill 2 minutes.
min_clip = "3s"
max_clip = "6s"
order    = "chronological"
variety  = 0.15

[[selection.exclude]]   # before the user's 0:32 start point
file  = "DJI_20260726134120_0047_D.MP4"
start = "0s"
end   = "34s"

[[selection.exclude]]   # padding around the forced hay-bale pick (2:29-2:35)
file  = "DJI_20260726134120_0047_D.MP4"
start = "2m25s"
end   = "2m39s"

[[selection.exclude]]   # padding around the two forced lateral picks (3:22-3:37),
# extended to 3:58 to also cover the rider reaching up and grabbing the
# drone out of the air right after — the auto-picker liked its motion/
# sharpness signal but it's just a close-up blur of a cap, not usable.
file  = "DJI_20260726134120_0047_D.MP4"
start = "3m18s"
end   = "3m58s"

[[selection.exclude]]   # after the user's 4:58 end point
file  = "DJI_20260726134120_0047_D.MP4"
start = "296s"
end   = "310s"

[transition]
default                = "fade"
duration               = "350ms"
speed_ramp_probability = 0.35
speed_ramp_duration    = "1500ms"
speed_ramp_factor      = 3.0
speed_ramp_flash       = true

[intro]
duration = "4.5s"      # longer than the social cut's title card
mode     = "card"
bg_color = "#14200a"
fade_in  = "600ms"
fade_out = "600ms"

[[intro.layers]]
kind     = "text"
content  = "La plimbare cu ATV-ul"   # no date layer here, by request
font     = "arialbd.ttf"
size     = 92
color    = "#FFE8B0"
position = "center"

[outro]
duration = "2.5s"
mode     = "overlay"   # rides on the last segment's footage, adds no extra time
fade_in  = "500ms"
fade_out = "800ms"

[[outro.layers]]
kind       = "text"
content    = "Tomești · 26.07.2026"
font       = "arialbd.ttf"
size       = 60
color      = "#FFFFFF"
position   = "bottom-center"
background = { color = "#000000AA", padding = "20px" }

[grading]
stabilize = false   # DJI gimbal already handles this
