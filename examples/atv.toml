# End-to-end test against real GoPro footage with a synth soundtrack.
# Source: ~2h 16m of HEVC 4K@50p (six files; the four GX*0384 ones are
# chapters of a single 2h take). Soundtrack: 30s 120 BPM kick drum with a
# drop at t=10s. Output target: 25s @ 1080p/30, beat-aligned.

schema_version = 1

[project]
name            = "ATV ride · Chișoda"
target_duration = "25s"
fps             = 30
seed            = 7

[[outputs]]
path          = "out/atv.mp4"
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

[input]
folder  = "E:/DATA/GOPRO VIDEO/2025.09 - La Chișoda cu ATV-ul"
include = ["**/*.MP4"]

[soundtrack]
file              = "C:/Users/vboca/OneDrive/Desktop/Sfântă-i slana.mp3"
beat_align        = true
duck_count        = 2
duck_min_spacing  = "5s"
ducking_db        = -18

[selection]
min_clip = "1.5s"
max_clip = "3.5s"

[transition]
default  = "fade"
duration = "400ms"

[intro]
duration = "2.5s"
mode     = "card"
fade_in  = "400ms"
fade_out = "400ms"

[[intro.layers]]
kind     = "text"
content  = "Chișoda · 2025"
font     = "arialbd.ttf"
size     = 96
color    = "#FFFFFF"
position = "center"

[outro]
duration = "2.0s"
mode     = "card"
fade_in  = "300ms"
fade_out = "500ms"

[[outro.layers]]
kind     = "text"
content  = "@vbocan · cu ATV-ul"
font     = "arial.ttf"
size     = 64
color    = "#FFFFFF"
position = "center"

[grading]
# HyperSmooth in-camera already stabilizes modern GoPro footage. Only turn
# this on for HyperSmooth-Off recordings or other shaky non-GoPro sources.
stabilize = false
# lut     = "luts/teal_orange.cube"
