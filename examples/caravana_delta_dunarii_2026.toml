# Caravana medicală — Delta Dunării, 20–24 mai 2026.
# 36 fotografii (dedup din ~145) + 31 clipuri GoPro,
# ordonate strict cronologic peste piesa 'La Chilia-n port' de Ionel Tudorache.

schema_version = 1

[project]
name            = "Caravana Delta Dunarii 2026"
target_duration = "5m25s"
fps             = 30
seed            = 524
fade_in         = "700ms"
fade_out        = "1500ms"

[input]
folder  = 'E:/TEMP/Video Caravana Delta Dunării'
include = ["GX*.MP4", "VID_*.mp4"]

# Force-include two phone videos that the GoPro-tuned scorer would otherwise
# skip — they hold key scenes the user wants in the reel.
[[input.ranges]]
file  = "VID_20260521_204418345.mp4"
start = "20s"
end   = "26s"

[[input.ranges]]
file  = "VID_20260521_210657739.mp4"
start = "30s"
end   = "36s"

[soundtrack]
file       = 'E:/TEMP/Video Caravana Delta Dunării/Audio/YTDown_YouTube_Ionel-Tudorache-La-Chilia-n-port_Media_dXfeU3k6FBs_007_128k.mp3'
beat_align = true
fade_out   = "2500ms"
duck_count = 5          # more frequent reveals of the original audio
duck_min_spacing = "20s"
duck_min_dur = "3s"
duck_max_dur = "6s"
ducking_db = -22.0      # dip the music a bit deeper so dialog cuts through
beat_burst   = "auto"   # dynamic montage rapid-cut around the loud bit

[selection]
order          = "strict_chronological"
min_clip       = "3s"
max_clip       = "7s"
max_per_source = 5
variety        = 0.20

[transition]
default                = "fade"
duration               = "150ms"
speed_ramp_probability = 0.15

[intro]
duration = "5.0s"
mode     = "card"
bg_color = "#0d1b2a"
fade_in  = "600ms"
fade_out = "500ms"

[[intro.layers]]
kind         = "text"
content      = 'Caravana medicală'
font         = "arialbd.ttf"
size         = 72
color        = "#FFFFFF"
position     = "center"
y_offset     = -150
appear_at    = "0.2s"
disappear_at = "4.5s"
fade_in      = "500ms"
fade_out     = "400ms"

[[intro.layers]]
kind         = "text"
content      = 'Delta Dunării'
font         = "arialbd.ttf"
size         = 108
color        = "#f5a623"
position     = "center"
y_offset     = -40
appear_at    = "0.6s"
disappear_at = "4.7s"
fade_in      = "500ms"
fade_out     = "500ms"

[[intro.layers]]
kind         = "text"
content      = '20 – 24 mai 2026'
font         = "arial.ttf"
size         = 42
color        = "#E8D8B5"
position     = "center"
y_offset     = 80
appear_at    = "1.4s"
disappear_at = "4.8s"
fade_in      = "500ms"
fade_out     = "500ms"

[[intro.layers]]
kind         = "text"
content      = 'Chilia și Crișan'
font         = "ariali.ttf"
size         = 36
color        = "#B8C8DA"
position     = "center"
y_offset     = 160
appear_at    = "2.0s"
disappear_at = "4.8s"
fade_in      = "600ms"
fade_out     = "500ms"

[outro]
duration = "7s"
mode     = "card"
bg_color = "#000000"
fade_in  = "800ms"
fade_out = "2500ms"

[[outro.layers]]
kind         = "text"
content      = 'Mulțumim,'
font         = "arial.ttf"
size         = 56
color        = "#E8D8B5"
position     = "center"
y_offset     = -80
appear_at    = "0.6s"
disappear_at = "5.5s"
fade_in      = "700ms"
fade_out     = "1500ms"

[[outro.layers]]
kind         = "text"
content      = 'Delta Dunării'
font         = "arialbd.ttf"
size         = 96
color        = "#f5a623"
position     = "center"
y_offset     = 30
appear_at    = "1.0s"
disappear_at = "5.5s"
fade_in      = "800ms"
fade_out     = "1500ms"

[grading]
stabilize = false

[[outputs]]
path          = 'E:/TEMP/Video Caravana Delta Dunării/Caravana_Delta_Dunarii_Reel.mp4'
resolution    = "1920x1080"
encoder       = "auto"
crf           = 20
audio_bitrate = "192k"

