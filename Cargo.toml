[workspace]
resolver = "2"
members = [
    "src/vibecut",
    "src/vibecut-ops",
    "src/vibecut-mcp",
    "src/vibecut-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Valer Bocan <vbocan@gmail.com>"]
repository = "https://github.com/vbocan/vibecut"

[workspace.dependencies]
# Shared error types so the MCP layer can pretty-print pipeline errors
# without round-tripping through stringly-typed messages.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tracing — both crates emit structured logs; the binary drains them.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime + axum stack for the MCP HTTP server.
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
tower = "0.5"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 1
